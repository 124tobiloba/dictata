<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dictata — History</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d26;
      --surface2: #22263a;
      --accent: #7c6df0;
      --green: #48bb78;
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --muted: #7f8fa6;
      --radius: 10px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 { font-size: 17px; font-weight: 600; }

    .hdr-actions { display: flex; gap: 8px; }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger:hover { background: #e53e3e; border-color: #e53e3e; }

    main { flex: 1; overflow-y: auto; padding: 20px 24px; }

    .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 15px; }

    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .entry:hover { border-color: rgba(124,109,240,0.4); }

    .entry-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .entry-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .entry-raw {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      display: none;
    }

    .entry-raw.visible { display: block; }

    .entry-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .entry-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .entry-btn:hover { background: var(--surface2); color: var(--text); }
    .entry-btn.paste:hover { border-color: var(--green); color: var(--green); }
    .entry-btn.del:hover { border-color: #e53e3e; color: #e53e3e; }

    .duration-badge {
      background: var(--surface2);
      border-radius: 100px;
      padding: 2px 8px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎙 Dictation History</h1>
    <div class="hdr-actions">
      <button class="btn" id="btn-settings">Settings</button>
      <button class="btn danger" id="btn-clear">Clear all</button>
    </div>
  </header>
  <main id="list">
    <p class="empty" id="empty">No dictations yet.<br/>Hold your push-to-talk shortcut and speak.</p>
  </main>
  <script src="historyRenderer.js"></script>
</body>
</html>
